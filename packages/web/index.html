<!doctype html>

<html lang="en">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Alegreya-variable.woff2" crossorigin />
    <title>Love Letter</title>
    <meta name="description" content="The card game, playable in a browser, from a terminal, or by an AI agent. Share a link; anyone or anything can take a seat." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Love Letter" />
